# ============================================================
# TERMINAL
# ============================================================
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# ============================================================
# GENERAL
# ============================================================
set -g mouse on
set -g detach-on-destroy off
set -g escape-time 0
set -g focus-events on
set -g history-limit 1000000
set -g set-clipboard on
set -g status-position top

# ============================================================
# INDEXING (1-based)
# ============================================================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ============================================================
# PREFIX
# ============================================================
unbind C-b
set -g prefix `
bind ` send-prefix

bind a last-window
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded..."

bind -n M-H previous-window
bind -n M-L next-window

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ============================================================
# COPY MODE (vi)
# ============================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# ============================================================
# SESH (Session Manager)
# ============================================================
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
bind -N "last-session (via sesh) " L run-shell "sesh last"
bind -N "switch to root session (via sesh) " 9 run-shell "sesh connect --root $(pwd)"
bind-key "T" run-shell "sesh connect \"$( \
	sesh list -t --icons | fzf-tmux -p 80%,70% \
		--no-sort --ansi --border-label ' sesh ' --prompt '🪟 ' \
		--header ' ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
		--bind 'tab:down,btab:up' \
		--bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list --icons)' \
		--bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t --icons)' \
		--bind 'ctrl-g:change-prompt(⚙️ )+reload(sesh list -c --icons)' \
		--bind 'ctrl-x:change-prompt(📁 )+reload(sesh list -z --icons)' \
		--bind 'ctrl-f:change-prompt(🔎 )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
		--bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(🪟 )+reload(sesh list -t --icons)' \
		--preview-window 'right:55%' \
		--preview 'sesh preview {}' \
)\""

# ============================================================
# PLUGINS
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'


# ============================================================
# SESSION RESTORE
# ============================================================
set -g @continuum-restore 'on'

# ============================================================
# POWERKIT
# ============================================================
set -g @powerkit_theme 'kanagawa'
set -g @powerkit_theme_variant 'dragon'
set -g @powerkit_separator_style "none"
set -g @powerkit_plugins         "memory"
set -g @powerkit_status_order    "session,windows,plugins"
set -g @powerkit_active_window_show_index "false"
set -g @powerkit_inactive_window_show_index "false"
set -g @powerkit_active_window_icon "#[]"
set -g @powerkit_inactive_window_icon "#[]"
set -g @powerkit_active_window_title "#W"
set -g @powerkit_inactive_window_title "#W"

run '~/.tmux/plugins/tpm/tpm'
